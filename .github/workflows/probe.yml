name: Probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="HardwareRadarBot/1.0 (+https://hardware-radar.de/bot; hardwareradar.com@gmail.com)"
          BR="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          for u in https://it-versand.com/ https://it-versand.com/robots.txt https://it-versand.com/collections/monitor-refurbished https://it-versand.com/collections/monitor-refurbished/products.json "https://it-versand.com/products.json?limit=2"; do
            R=$(curl -s -o /tmp/b -w "%{http_code} %{url_effective} %{size_download}" -L -A "$UA" -H "Accept-Language: de-DE" "$u")
            B=$(head -c 160 /tmp/b | tr -d '\n\r%')
            R2=$(curl -s -o /dev/null -w "%{http_code}" -L -A "$BR" "$u")
            echo "::warning::$u bot=$R browser=$R2 body=$B"
          done
