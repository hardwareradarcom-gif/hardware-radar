# Startet den Hardware-Radar-Crawler, speichert neue Preise im Repository und veröffentlicht die Website
# (inklusive Produktseiten und Kaufberatungen) danach automatisch neu.
#   Großer Lauf (neue Produkte und Shops finden): 3x täglich
#   Schnell-Prüfung (nur bekannte Preise neu prüfen): alle 2 Stunden dazwischen
name: Preise aktualisieren

on:
  schedule:
    # Zeiten in UTC: 05:38, 10:38, 16:38 = 6:38, 11:38, 17:38 Uhr deutscher Winterzeit
    - cron: "38 5,10,16 * * *"
    # Schnell-Prüfung: 07:08, 09:08 … 21:08 UTC
    - cron: "8 7-21/2 * * *"
  workflow_dispatch:      # erlaubt den manuellen Start unter "Actions"
    inputs:
      mode:
        description: "full = großer Lauf, refresh = nur Preise neu prüfen"
        default: full
        type: choice
        options: [full, refresh]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Crawler ausführen
        run: |
          if [ "${{ github.event.schedule }}" = "8 7-21/2 * * *" ] || [ "${{ inputs.mode }}" = "refresh" ]; then
            node tools/crawler/crawl.mjs --refresh
          else
            node tools/crawler/crawl.mjs
          fi

      - name: Neue Daten speichern
        run: |
          git config user.name "hardware-radar-bot"
          git config user.email "hardwareradar.com@gmail.com"
          git add data/catalog.json data/deals.json tools/crawler/state.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Preise aktualisiert $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi

  deploy:
    needs: crawl
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
